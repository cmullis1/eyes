<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>overflow</title>
<style>
  body { margin: 0; font: 18px/1.4 Arial, sans-serif; background: #f4f6fa; }
  #banner { position: fixed; top: 0; left: 0; right: 0; height: 140px; background: #c0392b; color: #fff; z-index: 10; padding: 16px 24px; box-sizing: border-box; }
  #covered { position: absolute; top: 40px; left: 40px; width: 180px; height: 50px; font-size: 18px; }
  #fine { position: absolute; top: 200px; left: 40px; width: 180px; height: 50px; font-size: 18px; }
  #wide { position: absolute; top: 300px; left: 0; width: 2300px; height: 120px; background: #7fb3d5; }
  #label { position: absolute; top: 460px; left: 0; width: 50vw; white-space: nowrap; overflow: hidden; background: #f9e79f; }
  #label span { display: inline-block; width: 1200px; }
</style>
</head>
<body>
<div id="banner">Sticky banner that sits on top of the first button</div>
<button id="covered">Covered button</button>
<button id="fine">Reachable button</button>
<div id="wide">A block that is 2300px wide</div>
<div id="label"><span>This label is cut off when the window is narrower than twice the text width</span></div>
</body>
</html>
