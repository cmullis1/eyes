<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Random dots</title>
<style>
  html, body { margin: 0; background: #fff; }
  .dot { position: absolute; width: 40px; height: 40px; border-radius: 50%; }
</style>
</head>
<body>
<script>
// Draws dots at random places in random colours. ?seed=N sets window.__eyes.seed first.
const seed = new URLSearchParams(location.search).get('seed');
if (seed !== null) window.__eyes = { seed: Number(seed) };
window.firstRandom = Math.random();
for (let i = 0; i < 40; i++) {
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.left = `${Math.floor(Math.random() * 1200)}px`;
  dot.style.top = `${Math.floor(Math.random() * 600)}px`;
  dot.style.background = `hsl(${Math.floor(Math.random() * 360)} 70% 50%)`;
  document.body.appendChild(dot);
}
</script>
</body>
</html>
