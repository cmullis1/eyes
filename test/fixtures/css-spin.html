<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CSS spin fixture</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  #box { position: absolute; left: 300px; top: 200px; width: 160px; height: 160px; background: #a53b6e; animation: slide 2s linear infinite; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(400px); } }
</style>
</head>
<body>
<div id="box"></div>
</body>
</html>
