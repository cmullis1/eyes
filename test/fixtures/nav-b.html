<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Navigation fixture, second page</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  #box { position: absolute; left: 100px; top: 100px; width: 100px; height: 100px; background: #3b6ea5; animation: slide 2s linear infinite; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(400px); } }
</style>
</head>
<body>
<div id="box"></div>
</body>
</html>
